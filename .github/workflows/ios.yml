name: iPhone app

# Builds the iPhone app on a GitHub Mac. The .ipa is not signed: it is signed
# on install with the owner's free Apple ID (Sideloadly / AltStore, see README).
# Built only where it is published (the default branch): builds of the
# working branches and of pull requests were cancelled by the next push and
# mailed the owner a "Run failed" for nothing.
on:
  push:
    branches: [claude/opentoon-web-app-free-55k898]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WEB_BUILD: ${{ github.run_number }}
      - name: Package the web code for updates without a computer (see src/lib/update.ts)
        run: |
          (cd dist && zip -qr ../web.zip .)
          native=$(grep -oE 'NATIVE_LEVEL = [0-9]+' src/lib/update.ts | grep -oE '[0-9]+')
          echo "{\"build\": ${{ github.run_number }}, \"native\": $native}" > web.json
          cat web.json
      - run: npx cap sync ios
      - name: Build the app (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          test -d ios/build/Build/Products/Release-iphoneos/App.app
      - name: Package WebTrad.ipa
        run: |
          mkdir -p ipa/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && zip -qry ../WebTrad.ipa Payload)
          ls -lh WebTrad.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WebTrad-ipa
          path: WebTrad.ipa
      - name: Publish as the latest release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: WebTrad iPhone ${{ github.run_number }}
          body: |
            Application iPhone de WebTrad (non signée).
            Installation : voir « Application iPhone » dans le README.
            Lien direct, toujours la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/WebTrad.ipa
            L'appli installée se met aussi à jour toute seule (web.zip), sauf quand une réinstallation est nécessaire.
          files: |
            WebTrad.ipa
            web.zip
            web.json
          make_latest: true
